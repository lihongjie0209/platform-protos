syntax = "proto3";

package platform.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lihongjie0209/platform-protos/gen/go/platform/common/v1;commonv1";

message PageRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message PageResult {
  uint64 total = 1;
  uint32 page = 2;
  uint32 page_size = 3;
}

message RequestContext {
  string request_id = 1;
  string trace_id = 2;
  string actor_id = 3;
  string actor_type = 4;
  string tenant_id = 5;
  string membership_id = 6;
}

message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string aggregate_id = 3;
  string aggregate_type = 4;
  string tenant_id = 5;
  uint32 schema_version = 6;
  google.protobuf.Timestamp occurred_at = 7;
  RequestContext context = 8;
  bytes payload = 9;
}

// DeadLetterEvent records an event that a durable consumer could not process.
// Exactly one of original_event or original_data is normally populated. Raw
// data is retained only when the original envelope could not be decoded.
message DeadLetterEvent {
  EventEnvelope original_event = 1;
  string original_subject = 2;
  string consumer = 3;
  string reason = 4;
  uint64 delivery_count = 5;
  google.protobuf.Timestamp dead_lettered_at = 6;
  bool decoding_failed = 7;
  bytes original_data = 8;
}
