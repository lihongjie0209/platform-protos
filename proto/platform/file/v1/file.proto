syntax = "proto3";

package platform.file.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lihongjie0209/platform-protos/gen/go/platform/file/v1;filev1";

service FileService {
  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);
  rpc InitiateMultipartUpload(InitiateMultipartUploadRequest) returns (InitiateMultipartUploadResponse);
  rpc AuthorizeUploadPart(AuthorizeUploadPartRequest) returns (AuthorizeUploadPartResponse);
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse);
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc ReportScanResult(ReportScanResultRequest) returns (ReportScanResultResponse);
  rpc AuthorizeDownload(AuthorizeDownloadRequest) returns (AuthorizeDownloadResponse);
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
message FileMetadata {
  string id = 1;
  string tenant_id = 2;
  string owner_id = 3;
  string bucket = 4;
  string object_key = 5;
  string filename = 6;
  string content_type = 7;
  int64 size = 8;
  string checksum_sha256 = 9;
  string status = 10;
  string scan_status = 11;
  int64 version = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string created_by = 15;
  string updated_by = 16;
  string upload_mode = 17;
  string multipart_upload_id = 18;
  int64 part_size = 19;
  int32 part_count = 20;
  google.protobuf.Timestamp upload_expires_at = 21;
  string application_id = 22;
}
message InitiateUploadRequest {
  string tenant_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size = 4;
  string checksum_sha256 = 5;
  string idempotency_key = 6;
  string application_id = 7;
}
message InitiateUploadResponse {
  FileMetadata file = 1;
  string upload_url = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}
message InitiateMultipartUploadRequest {
  string tenant_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size = 4;
  string checksum_sha256 = 5;
  string idempotency_key = 6;
  int64 part_size = 7;
  string application_id = 8;
}
message InitiateMultipartUploadResponse {
  FileMetadata file = 1;
  string upload_id = 2;
  int64 part_size = 3;
  int32 part_count = 4;
  google.protobuf.Timestamp expires_at = 5;
}
message AuthorizeUploadPartRequest {
  string id = 1;
  string tenant_id = 2;
  int32 part_number = 3;
  string application_id = 4;
}
message AuthorizeUploadPartResponse {
  string upload_url = 1;
  map<string, string> headers = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message CompletedPart {
  int32 part_number = 1;
  string etag = 2;
}
message CompleteMultipartUploadRequest {
  string id = 1;
  string tenant_id = 2;
  repeated CompletedPart parts = 3;
  string checksum_sha256 = 4;
  int64 expected_version = 5;
  string application_id = 6;
}
message CompleteMultipartUploadResponse {
  FileMetadata file = 1;
}
message AbortMultipartUploadRequest {
  string id = 1;
  string tenant_id = 2;
  int64 expected_version = 3;
  string application_id = 4;
}
message AbortMultipartUploadResponse {
  FileMetadata file = 1;
}
message CompleteUploadRequest {
  string id = 1;
  string tenant_id = 2;
  string checksum_sha256 = 3;
  int64 expected_version = 4;
  string application_id = 5;
}
message CompleteUploadResponse {
  FileMetadata file = 1;
}
message ReportScanResultRequest {
  string id = 1;
  string tenant_id = 2;
  string scan_status = 3;
  int64 expected_version = 4;
  string application_id = 5;
}
message ReportScanResultResponse {
  FileMetadata file = 1;
}
message AuthorizeDownloadRequest {
  string id = 1;
  string tenant_id = 2;
  string application_id = 3;
}
message AuthorizeDownloadResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message GetMetadataRequest {
  string id = 1;
  string tenant_id = 2;
  string application_id = 3;
}
message GetMetadataResponse {
  FileMetadata file = 1;
}
message DeleteRequest {
  string id = 1;
  string tenant_id = 2;
  int64 expected_version = 3;
  string application_id = 4;
}
message DeleteResponse {
  FileMetadata file = 1;
}
message FileStatusChangedEvent {
  FileMetadata file = 1;
}
