syntax = "proto3";

package platform.identity.v1;

import "google/protobuf/timestamp.proto";
import "platform/common/v1/common.proto";

option go_package = "github.com/lihongjie0209/platform-protos/gen/go/platform/identity/v1;identityv1";

service IdentityService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc RevokeTenantSessions(RevokeTenantSessionsRequest) returns (RevokeTenantSessionsResponse);
  rpc IssueTenantToken(IssueTenantTokenRequest) returns (IssueTenantTokenResponse);
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse);
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_CLOSED = 4;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string phone = 5;
  UserStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int64 version = 9;
  string created_by = 10;
  string updated_by = 11;
}

message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  User user = 1;
}
message BatchGetUsersRequest {
  repeated string user_ids = 1;
}
message BatchGetUsersResponse {
  repeated User users = 1;
}
message ListUsersRequest {
  string keyword = 1;
  UserStatus status = 2;
  platform.common.v1.PageRequest page = 3;
}
message ListUsersResponse {
  repeated User users = 1;
  platform.common.v1.PageResult page = 2;
}
message ValidateSessionRequest {
  string session_id = 1;
  string user_id = 2;
}
message ValidateSessionResponse {
  bool valid = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message RevokeTenantSessionsRequest {
  string user_id = 1;
  string tenant_id = 2;
  string reason = 3;
}
message RevokeTenantSessionsResponse {
  uint64 revoked_count = 1;
}
message IssueTenantTokenRequest {
  string user_id = 1;
  string tenant_id = 2;
  string membership_id = 3;
  // Existing interactive session whose refresh-token scope must be updated.
  // Required for user tenant selection; trusted service flows without a user
  // session should use a separate service credential instead.
  string session_id = 4;
}
message IssueTenantTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message GetServiceAccountRequest {
  string service_account_id = 1;
}
message GetServiceAccountResponse {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  repeated string audiences = 4;
}

message UserStatusChangedEvent {
  string user_id = 1;
  UserStatus previous_status = 2;
  UserStatus current_status = 3;
  string reason = 4;
}

message UserCreatedEvent {
  User user = 1;
}

message SessionRevokedEvent {
  string session_id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string reason = 4;
}

enum PasswordChangeType {
  PASSWORD_CHANGE_TYPE_UNSPECIFIED = 0;
  PASSWORD_CHANGE_TYPE_SELF_SERVICE = 1;
  PASSWORD_CHANGE_TYPE_ADMINISTRATIVE_RECOVERY = 2;
}

message PasswordChangedEvent {
  string user_id = 1;
  uint64 revoked_sessions = 2;
  PasswordChangeType change_type = 3;
  string reason = 4;
}

enum MFAStatusChangeType {
  MFA_STATUS_CHANGE_TYPE_UNSPECIFIED = 0;
  MFA_STATUS_CHANGE_TYPE_ENABLED = 1;
  MFA_STATUS_CHANGE_TYPE_DISABLED = 2;
  MFA_STATUS_CHANGE_TYPE_RECOVERY_CODES_ROTATED = 3;
  MFA_STATUS_CHANGE_TYPE_ADMINISTRATIVE_RESET = 4;
}

message MFAStatusChangedEvent {
  string user_id = 1;
  bool enabled = 2;
  uint32 recovery_codes_remaining = 3;
  MFAStatusChangeType change_type = 4;
  string reason = 5;
}

message ServiceAccountStatusChangedEvent {
  string service_account_id = 1;
  string previous_status = 2;
  string current_status = 3;
  string reason = 4;
}
