syntax = "proto3";

package platform.search.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lihongjie0209/platform-protos/gen/go/platform/search/v1;searchv1";

// SearchService provides tenant-scoped global search and an internal indexing
// API for controlled backfills. Normal online mutations reach the index through
// SearchDocumentUpsertedEvent and SearchDocumentDeletedEvent.
service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc BatchUpsertDocuments(BatchUpsertDocumentsRequest) returns (BatchUpsertDocumentsResponse);
  rpc BatchDeleteDocuments(BatchDeleteDocumentsRequest) returns (BatchDeleteDocumentsResponse);
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_RELEVANCE = 1;
  SORT_ORDER_UPDATED_AT_DESC = 2;
  SORT_ORDER_UPDATED_AT_ASC = 3;
}

message SearchDocument {
  string id = 1;
  string tenant_id = 2;
  string source_service = 3;
  string document_type = 4;
  string source_id = 5;
  string application_id = 6;
  string title = 7;
  string summary = 8;
  string content = 9;
  string url = 10;
  string icon = 11;
  repeated string keywords = 12;
  map<string, string> attributes = 13;
  // Visibility tokens are generated by the owning service, never accepted
  // from a frontend request. Supported forms are tenant:*, user:<id>,
  // membership:<id>, role:<id>, and service-account:<id>.
  repeated string visibility_tokens = 14;
  string permission_code = 15;
  int64 source_version = 16;
  google.protobuf.Timestamp source_created_at = 17;
  google.protobuf.Timestamp source_updated_at = 18;
}

message StringValues {
  repeated string values = 1;
}

message SearchRequest {
  string tenant_id = 1;
  string query = 2;
  repeated string document_types = 3;
  repeated string application_ids = 4;
  map<string, StringValues> filters = 5;
  SortOrder sort = 6;
  uint32 page = 7;
  uint32 page_size = 8;
  repeated string facet_fields = 9;
}

message Highlight {
  string field = 1;
  repeated string fragments = 2;
}

message SearchHit {
  SearchDocument document = 1;
  double score = 2;
  repeated Highlight highlights = 3;
}

message FacetBucket {
  string value = 1;
  uint64 count = 2;
}

message Facet {
  string field = 1;
  repeated FacetBucket buckets = 2;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  repeated Facet facets = 5;
  uint64 took_milliseconds = 6;
}

message SuggestRequest {
  string tenant_id = 1;
  string prefix = 2;
  repeated string document_types = 3;
  uint32 limit = 4;
  repeated string application_ids = 5;
}

message Suggestion {
  string text = 1;
  string document_type = 2;
  string source_id = 3;
  string url = 4;
}

message SuggestResponse {
  repeated Suggestion suggestions = 1;
}

message GetDocumentRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetDocumentResponse {
  SearchDocument document = 1;
}

message BatchUpsertDocumentsRequest {
  repeated SearchDocument documents = 1;
  string idempotency_key = 2;
}

message BatchUpsertDocumentsResponse {
  uint32 accepted = 1;
}

message DocumentKey {
  string tenant_id = 1;
  string source_service = 2;
  string document_type = 3;
  string source_id = 4;
  int64 source_version = 5;
}

message BatchDeleteDocumentsRequest {
  repeated DocumentKey documents = 1;
  string idempotency_key = 2;
}

message BatchDeleteDocumentsResponse {
  uint32 accepted = 1;
}

message SearchDocumentUpsertedEvent {
  SearchDocument document = 1;
}

message SearchDocumentDeletedEvent {
  DocumentKey document = 1;
}
